name: Cloud Scheduled Retraining Pipeline

on:
  schedule:
    # Run every 14 days at 02:00 UTC (identical to Airflow schedule)
    - cron: '0 2 */14 * *'
  # Allows you to click "Run workflow" manually anytime from the GitHub UI!
  workflow_dispatch:
    inputs:
      force_tuning:
        description: 'Force emergency Optuna HPO even if no drift detected'
        required: false
        type: boolean
        default: false

jobs:
  train-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (OpenMP for XGBoost)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install NetSentry Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docker/requirements.pipeline.txt
          pip install -e .

      - name: Run Baseline Tournament
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python scripts/train_baselines.py

      - name: Run Production Retraining & Champion Promotion
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.force_tuning }}" = "true" ]; then
            EXTRA_ARGS="--force-tuning"
          fi
          python scripts/run_pipeline.py --top-k 3 $EXTRA_ARGS

      - name: Upload Drift and Baseline Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: retraining-artifacts
          path: |
            artifacts/drift/
            artifacts/baselines/
            artifacts/evaluation/
