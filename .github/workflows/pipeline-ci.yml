name: NetSentry Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # --------------------------------------------------------------------------
  # Job 1: Test & Lint Code Quality
  # --------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docker/requirements.pipeline.txt
          pip install pytest ruff
          pip install -e .

      - name: Run Ruff Linter
        run: |
          ruff check netsentry/ configs/ scripts/

      - name: Run Unit Tests
        run: |
          pytest tests/test_features/ -v

  # --------------------------------------------------------------------------
  # Job 2: Build & Verify Docker Pipeline Image
  # --------------------------------------------------------------------------
  docker-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Pipeline Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.pipeline
          push: false
          tags: netsentry-pipeline:test
          cache-from: type=gha
          cache-to: type=gha,mode=max