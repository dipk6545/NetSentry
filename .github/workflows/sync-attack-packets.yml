name: Sync Attack Packets to R2

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync-aiven-to-r2:
    name: Extract Aiven Attack Packets & Sync to R2
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ingestion Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas psycopg2-binary boto3 python-dotenv

      - name: Run Sync Engine
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'netsentry' }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          python netsentry/serving/sync_engine.py
