name: Auto Sync Code (Protect .github)

on:
  schedule:
    - cron: '0 * * * *' # Checks every hour
  workflow_dispatch:

jobs:
  sync-code:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Repo 2
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch and Merge Code Only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add Repo 1 as upstream remote
          git remote add upstream https://github.com/dipk6545/NetSentry.git
          git fetch upstream main

          # Pull everything EXCEPT .github folder
          git checkout upstream/main -- netsentry/ configs/ docker/ scripts/ tests/ dags/ pyproject.toml
          
          # Commit and push if there are code changes
          if ! git diff --staged --quiet; then
            git commit -m "chore(sync): auto-sync latest codebase from dipk6545/NetSentry"
            git push origin main
          fi
