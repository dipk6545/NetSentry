model_config: configs/models/random_forest.yaml

tuning:
  n_trials: 20
  direction: maximize
  metric: recall
  timeout_seconds: 7200

search_space:
  n_estimators:
    type: int
    low: 50
    high: 300
    step: 50
  max_depth:
    type: int
    low: 6
    high: 20
  min_samples_split:
    type: int
    low: 2
    high: 20
  min_samples_leaf:
    type: int
    low: 1
    high: 10
  max_features:
    type: categorical
    choices:
      - sqrt
      - log2
