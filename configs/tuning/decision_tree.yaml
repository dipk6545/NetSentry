model_config: configs/models/decision_tree.yaml

tuning:
  n_trials: 10
  direction: maximize
  metric: recall
  timeout_seconds: 600

search_space:
  max_depth:
    type: int
    low: 6
    high: 12
  min_samples_split:
    type: int
    low: 5
    high: 30
  min_samples_leaf:
    type: int
    low: 2
    high: 15
  criterion:
    type: categorical
    choices:
      - gini
      - entropy
