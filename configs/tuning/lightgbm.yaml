model_config: configs/models/lightgbm.yaml

tuning:
  n_trials: 30
  direction: maximize
  metric: recall
  timeout_seconds: 7200

search_space:
  n_estimators:
    type: int
    low: 100
    high: 400
    step: 50
  max_depth:
    type: int
    low: 4
    high: 12
  num_leaves:
    type: int
    low: 15
    high: 127
  min_child_samples:
    type: int
    low: 10
    high: 100
    step: 10
  learning_rate:
    type: float
    low: 0.01
    high: 0.25
    log: true
  reg_alpha:
    type: float
    low: 1e-5
    high: 10.0
    log: true
  reg_lambda:
    type: float
    low: 1e-3
    high: 10.0
    log: true
  subsample:
    type: float
    low: 0.6
    high: 1.0
  colsample_bytree:
    type: float
    low: 0.6
    high: 1.0
  scale_pos_weight:
    type: float
    low: 1.0
    high: 5.0
