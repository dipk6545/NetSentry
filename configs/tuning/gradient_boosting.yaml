model_config: configs/models/gradient_boosting.yaml

tuning:
  n_trials: 5
  direction: maximize
  metric: recall
  timeout_seconds: 600

search_space:
  n_estimators:
    type: int
    low: 50
    high: 120
    step: 35
  max_depth:
    type: int
    low: 3
    high: 6
  learning_rate:
    type: float
    low: 0.05
    high: 0.2
    log: true
  min_samples_split:
    type: int
    low: 5
    high: 20
  subsample:
    type: float
    low: 0.8
    high: 1.0
