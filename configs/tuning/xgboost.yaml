model_config: configs/models/xgboost.yaml

tuning:
  n_trials: 15
  direction: maximize
  metric: roc_auc

search_space:
  n_estimators:
    type: int
    low: 50
    high: 200
    step: 25
  max_depth:
    type: int
    low: 3
    high: 8
  learning_rate:
    type: float
    low: 0.01
    high: 0.2
    log: true
