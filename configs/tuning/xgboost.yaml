model_config: configs/models/xgboost.yaml

tuning:
  n_trials: 8
  direction: maximize
  metric: recall
  timeout_seconds: 1200

search_space:
  n_estimators:
    type: int
    low: 100
    high: 250
    step: 50
  max_depth:
    type: int
    low: 5
    high: 8
  min_child_weight:
    type: int
    low: 1
    high: 6
  learning_rate:
    type: float
    low: 0.05
    high: 0.2
    log: true
  subsample:
    type: float
    low: 0.7
    high: 1.0
  colsample_bytree:
    type: float
    low: 0.7
    high: 1.0
  scale_pos_weight:
    type: float
    low: 1.0
    high: 4.0
